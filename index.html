<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Justice Bak</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0078d7, #00b294);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.15);
      text-align: center;
      width: 400px;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    button {
      background: #0078d7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #005a9e;
    }
    input {
      width: 90%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }
    .hidden { display: none; }
    .progress {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .step {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #ccc;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
    }
    .active {
      background: #0078d7;
    }
    .success {
      margin-top: 20px;
    }
    .check-icon {
      width: 60px;
      height: 60px;
      margin: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>JusticeBak: Processe sem ter marca</h1>
    <div class="progress">
      <div id="step1" class="step">1</div>
      <div id="step2" class="step">2</div>
      <div id="step3" class="step">3</div>
      <div id="step4" class="step">4</div>
    </div>

    <button id="btnProcesso">Processo</button>

    <div id="opcoes" class="hidden">
      <button id="btnFisico">Processo Físico</button>
      <button id="btnEletronico">Processo Eletrônico</button>
    </div>

    <div id="etapaEmail" class="hidden">
      <p>Digite o e-mail ou telefone do destinatário:</p>
      <input type="text" id="destinatario">
      <button id="btnContinuar1">Continuar</button>
    </div>

    <div id="etapaTaxa" class="hidden">
      <p>Digite uma taxa adicional em BRL:</p>
      <input type="number" id="taxa">
      <button id="btnFinalizar">Finalizar</button>
    </div>

    <div id="resultado" class="hidden success">
      <svg class="check-icon" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="25" fill="none" stroke="#28a745" stroke-width="2"/>
        <path fill="none" stroke="#28a745" stroke-width="4" d="M14 27l7 7 17-17"/>
      </svg>
      <p style="color:#28a745; font-size:20px; font-weight:bold;">Processo Efetuado</p>
    </div>
  </div>

  <script>
    const btnProcesso = document.getElementById("btnProcesso");
    const opcoes = document.getElementById("opcoes");
    const btnFisico = document.getElementById("btnFisico");
    const btnEletronico = document.getElementById("btnEletronico");
    const etapaEmail = document.getElementById("etapaEmail");
    const etapaTaxa = document.getElementById("etapaTaxa");
    const btnContinuar1 = document.getElementById("btnContinuar1");
    const btnFinalizar = document.getElementById("btnFinalizar");
    const resultado = document.getElementById("resultado");

    const steps = [document.getElementById("step1"), document.getElementById("step2"), document.getElementById("step3"), document.getElementById("step4")];

    function activateStep(n) {
      steps.forEach((s, i) => {
        s.classList.toggle("active", i === n);
      });
    }

    btnProcesso.onclick = () => {
      opcoes.classList.remove("hidden");
      activateStep(0);
    };

    btnFisico.onclick = btnEletronico.onclick = () => {
      etapaEmail.classList.remove("hidden");
      activateStep(1);
    };

    btnContinuar1.onclick = () => {
      etapaTaxa.classList.remove("hidden");
      activateStep(2);
    };

    btnFinalizar.onclick = () => {
      resultado.classList.remove("hidden");
      activateStep(3);
    };
  </script>
</body>
</html>
